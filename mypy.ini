# mypy.ini — Type checking configuration for wp_ssl_bootstrap.py
# PATCH-277 Phase 2: disallow_untyped_defs = True
#
# Usage:
#   mypy --config-file mypy.ini wp_ssl_bootstrap.py
#
# CI integration (GitHub Actions example):
#   - name: Type check
#     run: |
#       pip install mypy
#       mypy --config-file mypy.ini wp_ssl_bootstrap.py

[mypy]
python_version = 3.8

# ── Phase 2 (ACTIVE) — All functions must have complete type annotations ──
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True

# ── Phase 3 (next step) ──
# strict = True
# disallow_any_generics = True
# disallow_untyped_calls = True
# warn_unreachable = True

# ── Global exemption ──
# subprocess.run() with encoding= guarantees str stdout/stderr,
# but typeshed annotates them as Optional[str].
# Suppress union-attr globally to avoid 80+ false positives.
# Remove this line when migrating to Phase 3 (and add per-line ignores).
disable_error_code = union-attr

# fcntl is Linux-only, typeshed may not have full stubs
[mypy-fcntl]
ignore_missing_imports = True
